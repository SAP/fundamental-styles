name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    name: Lint commit message
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  docs-integrity:
    runs-on: ubuntu-latest
    name: Docs integrity
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nodejs
        name: Install dependencies
      - name: Test documentation extraction
        run: yarn vitest packages/styles/tests/docs-extractor.test.ts --run --reporter=verbose
      - name: Generate documentation
        run: |
          yarn run docs:extract
          yarn generate:ai-docs
      - name: Validate documentation
        run: |
          yarn validate:docs
          yarn run test:ai-docs
      - name: Check generated documentation drift
        run: |
          git diff --exit-code -- docs/
          test -z "$(git ls-files --others --exclude-standard -- docs/)"

  install-lint-build:
    runs-on: ubuntu-latest
    name: Install, Lint, Build
    environment: ci
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nodejs
        name: Install dependencies
      - name: Test release notes generation
        run: node --test .github/actions/generate-conventional-release-notes/test-generate-conventional-release-notes.mjs
      - run: yarn run lint
      - run: yarn run build:prod
      - run: yarn run size
